name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      api_revision:
        description: 'SHA API verificado: esta revisión, o el mismo SHA del frontend de reversión'
        required: true
        type: string
      frontend_revision:
        description: 'SHA completo del frontend a publicar; vacío usa esta revisión (permite reversión)'
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Validate coordinated release
        working-directory: ${{ github.workspace }}
        if: github.event_name == 'workflow_dispatch'
        env:
          API_REVISION: ${{ inputs.api_revision }}
          FRONTEND_REVISION: ${{ inputs.frontend_revision }}
        run: |
          [[ "$API_REVISION" =~ ^[0-9a-f]{40}$ ]]
          if [ -n "$FRONTEND_REVISION" ]; then
            [[ "$FRONTEND_REVISION" =~ ^[0-9a-f]{40}$ ]]
          fi
          test "$API_REVISION" = "$GITHUB_SHA" || {
            test -n "$FRONTEND_REVISION" && test "$API_REVISION" = "$FRONTEND_REVISION"
          }

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.frontend_revision || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build production PWA
        run: npm run build
        env:
          VITE_API_URL: https://api-cartera.rtdev.uk

      - name: Verify Pages artifact
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/CNAME
          test -f dist/manifest.webmanifest
          test -f dist/sw.js
          test "$(cat dist/CNAME)" = "cartera.rtdev.uk"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload frontend artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    if: github.event_name == 'workflow_dispatch'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
